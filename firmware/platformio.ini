; ============================================================
; 鲸屿 WhaleDock 固件
; 首次构建必读：../docs/环境搭建.md（代理配置 + CLI 首建流程）
;
; 版本锁定（40 台量产构建一致性依赖于此，勿随意改动）：
;   - 平台用 pioarduino 社区源（Arduino core 3.x / ESP-IDF 5.x）
;     PlatformIO 官方源 espressif32 停在 core 2.x / IDF 4.4（EOL），勿改回
;   - tag 55.03.39 为 2026-09 核实过的最新 release
;   - 屏驱动 GxEPD2 ^1.6.9，驱动类与屏 FPC 丝印对照见 src/drivers/epaper.h 头注释
; ============================================================

[platformio]
default_envs = whaledock

[env:whaledock]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39

board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8：16MB Quad Flash + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

; 双 OTA 分区 + LittleFS + 资产区 + coredump（对齐开发约定§5）
board_build.partitions = partitions_whaledock.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1    ; Serial 走原生 USB CDC；同一 USB 口兼作 USB-JTAG 调试
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Adafruit GFX 作为 GxEPD2 依赖自动解析；ArduinoJson 供 github 模块解析 REST 响应
lib_deps =
    ZinggJM/GxEPD2@^1.6.9
    bblanchon/ArduinoJson@^7.0.0
