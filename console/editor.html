<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲸屿 WhaleDock · 布局编辑器（D3）</title>
<link rel="stylesheet" href="css/style.css?v=20260924a">
<style>
  body { background: var(--bg); color: var(--text); font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; margin: 0; }

  .ed-wrap { display: flex; gap: 16px; padding: 16px 20px; align-items: flex-start; }
  .ed-left { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
  .ed-right { flex: 1; min-width: 0; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--text); }

  /* 图层列表 */
  .layers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .layers li { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
               display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .layers li:hover { border-color: var(--accent); }
  .layers li.sel { border-color: var(--accent); background: rgba(59,130,246,.12); }
  .layers li .del { color: var(--dim); cursor: pointer; padding: 0 4px; }
  .layers li .del:hover { color: var(--red); }

  /* 画布区 */
  .canvas-holder { position: relative; width: 800px; height: 480px; margin: 0 auto;
                   box-shadow: 0 4px 24px rgba(0,0,0,.4); border-radius: 4px; }
  #screen { display: block; border-radius: 4px; }
  .slot-hit { position: absolute; border: 1px dashed transparent; cursor: move; }
  .slot-hit:hover { border-color: rgba(59,130,246,.55); }
  .slot-hit.sel { border: 1px solid var(--accent); background: rgba(59,130,246,.06); }

  /* 属性面板 */
  .prop-grid { display: grid; grid-template-columns: 76px 1fr; gap: 8px 10px; font-size: 13px; align-items: center; }
  .prop-grid label { color: var(--dim); text-align: right; }
  .prop-grid input[type=text], .prop-grid input[type=number], .prop-grid select {
    width: 100%; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); font-size: 13px; }
  .prop-grid input:focus, .prop-grid select:focus { outline: none; border-color: var(--accent); }

  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .ed-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* 添加 widget 下拉 */
  .add-bar { display: flex; gap: 6px; }
  .add-bar select { flex: 1; }
</style>
</head>
<body>

<header>
  <div style="font-weight:700">鲸屿 WhaleDock · 布局编辑器 <span style="color:var(--dim);font-weight:400">D3 · 拖拽排版 → 协议 v1.1 JSON → 实机上屏</span></div>
  <div style="display:flex;gap:10px;align-items:center">
    <a href="index.html" style="color:var(--dim);text-decoration:none">← 工作台</a>
    <a href="simulator.html" style="color:var(--dim);text-decoration:none">模拟器</a>
  </div>
</header>

<div class="ed-wrap">
  <!-- 左栏：图层 + 添加 -->
  <div class="ed-left">
    <section class="card">
      <h2>图层（Widget）</h2>
      <ul id="layers" class="layers"></ul>
      <div class="add-bar" style="margin-top:10px">
        <select id="add-type">
          <option value="clock">clock 时钟</option>
          <option value="date">date 日期</option>
          <option value="calendar">calendar 日历</option>
          <option value="stats">stats 统计</option>
          <option value="barChart">barChart 柱状图</option>
          <option value="heatMap">heatMap 热力图</option>
          <option value="repo">repo 仓库标识</option>
          <option value="title">title 标题字标</option>
          <option value="text">text 文字</option>
          <option value="image">image 图片</option>
        </select>
        <button type="button" id="btn-add" class="flat">添加</button>
      </div>
    </section>
    <section class="card">
      <h2>操作</h2>
      <div class="ed-actions" style="flex-direction:column">
        <button type="button" id="btn-load-sample">加载示例布局</button>
        <button type="button" id="btn-del">删除选中</button>
        <button type="button" id="btn-export" class="primary">导出 JSON</button>
      </div>
      <div id="ed-msg" class="hint" style="margin-top:8px"></div>
    </section>
  </div>

  <!-- 中+右：画布 & 属性 -->
  <div class="ed-right">
    <section class="card" style="margin-bottom:16px">
      <h2>画布 <span style="color:var(--dim);font-weight:400">800×480 · 拖拽移动 / 边角缩放（写回 slotRect）</span></h2>
      <div class="canvas-holder" id="holder">
        <canvas id="screen" width="800" height="480"></canvas>
      </div>
    </section>

    <section class="card">
      <h2>属性 <span id="prop-title" style="color:var(--dim);font-weight:400">（未选中）</span></h2>
      <div class="prop-grid" id="props"></div>
      <div class="row" id="device-row">
        <input id="dev-addr" type="text" placeholder="设备地址 192.168.x.x（推送上屏用）" style="flex:1">
        <input id="dev-key" type="password" maxlength="6" placeholder="配对码" style="width:90px">
        <button type="button" id="btn-push" class="primary">推送上屏</button>
      </div>
    </section>
  </div>
</div>

<!-- Moveable：拖拽/缩放交互层（MIT，唯一外部依赖，自托管兜底见 README） -->
<script src="vendor/moveable.min.js"></script>

<!-- 复用模拟器的渲染器/校验器（sim.js 顶层绑定 simulator.html 元素，需先 stub） -->
<script>
  // sim.js 顶层引用了 simulator.html 的元素（$('json')、$('btn-render') 等）——先造桩再加载，
  // 编辑器只用 validate()/render()/rectOf 等纯函数与画布
  window.__simStubs = {};
  const stubIds = ['json','verdict','guides','btn-render','btn-sample','btn-demo','btn-live','data-state'];
  for (const id of stubIds) {
    if (!document.getElementById(id)) {
      const el = document.createElement(id.startsWith('btn') ? 'button' : 'div');
      el.id = id; el.style.display = 'none'; document.body.appendChild(el);
    }
  }
</script>
<script src="js/title_art.js?v=20260924c"></script>
<script src="js/whale_art.js?v=20260924"></script>
<script src="js/sim.js?v=20260924b"></script>
<script src="js/editor.js?v=20260924g"></script>

</body>
</html>
