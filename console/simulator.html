<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鲸屿 WhaleDock · 显示协议 v1 模拟器</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a2129; --border: #2a3542;
      --text: #d8e1ea; --dim: #8a99a8; --accent: #4da3ff; --teal: #39c5cf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 6px 12px;
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      background: rgba(15, 20, 25, 0.92); backdrop-filter: blur(6px);
    }
    h1 { font-size: 18px; margin: 0; }
    h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
    h1 a { color: var(--accent); text-decoration: none; font-size: 13px; margin-left: 12px; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px;
         padding-left: 9px; border-left: 3px solid var(--border); }
    .wrap { display: flex; gap: 16px; padding: 16px 20px 32px; align-items: flex-start; flex-wrap: wrap; }
    .panel { background: var(--card); border: 1px solid var(--border);
             border-radius: 10px; padding: 14px 16px; }
    .left { flex: 1 1 380px; min-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .right { flex: 1 1 auto; min-width: 0; }
    textarea {
      width: 100%; height: 260px; padding: 10px; resize: vertical;
      background: #0b0f13; color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      font: 12.5px/1.5 Consolas, "Cascadia Mono", monospace;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    button {
      padding: 7px 14px; background: #243040; color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13.5px; cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent);
                     color: #08131f; font-weight: 600; }
    .hint { color: var(--dim); font-size: 13px; margin: 6px 0 0; }
    .verdict { font-size: 13.5px; padding: 8px 12px; border-radius: 6px;
               background: var(--bg); border: 1px dashed var(--border);
               color: var(--dim); white-space: pre-wrap; max-height: 180px; overflow-y: auto; }
    .verdict.ok { color: #3ecf8e; border-color: #3ecf8e; }
    .verdict.bad { color: #ff6b6b; border-color: #ff6b6b; }
    .stage { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    canvas { background: #f5f4ef; border-radius: 4px;
             box-shadow: 0 6px 24px rgba(0,0,0,0.45); max-width: 100%; }
    label.inline { display: inline-flex; align-items: center; gap: 6px;
                   color: var(--dim); font-size: 13px; }
    .legend { display: flex; gap: 14px; color: var(--dim); font-size: 12.5px; }
    .legend i { display: inline-block; width: 10px; height: 10px;
                border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  </style>
</head>
<body>
  <header>
    <h1>显示协议 v1 模拟器 <small>800×480 四色 · 与固件校验规则同源</small><a href="./">← 配网调机台</a></h1>
    <div class="legend">
      <span><i style="background:#1c1c1c"></i>黑 black</span>
      <span><i style="background:#b3382c"></i>红 red（&lt;5%）</span>
      <span><i style="background:#d4a017"></i>黄 yellow</span>
    </div>
  </header>

  <div class="wrap">
    <div class="left">
      <section class="panel">
        <h2>布局 JSON（协议 v1）</h2>
        <textarea id="json" spellcheck="false" placeholder="粘贴布局 JSON，或点「加载协议示例」"></textarea>
        <div class="row">
          <button id="btn-render" class="primary">校验并渲染</button>
          <button id="btn-sample">加载概念图示例</button>
        </div>
      </section>

      <section class="panel">
        <h2>数据</h2>
        <div class="row" style="margin-top:0">
          <button id="btn-demo" class="primary">演示数据</button>
          <button id="btn-live">联网拉取真实数据</button>
        </div>
        <p class="hint" id="data-state">当前：演示数据（内置快照，不联网）。</p>
      </section>

      <section class="panel">
        <h2>校验结果</h2>
        <div id="verdict" class="verdict">等待校验。</div>
      </section>
    </div>

    <div class="right">
      <section class="panel stage">
        <h2 style="align-self:flex-start">屏幕预览</h2>
        <canvas id="screen" width="800" height="480"></canvas>
        <label class="inline"><input id="guides" type="checkbox"> 显示槽位参考线</label>
        <p class="hint">预览即固件渲染目标的 1:1 逼近（黑白红黄四色）；设备侧文本用 u8g2 字库子集，模拟器用系统字体近似。</p>
      </section>
    </div>
  </div>

  <script type="module" src="js/sim.js"></script>
</body>
</html>
